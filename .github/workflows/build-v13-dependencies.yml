name: Package V13 Dependencies
on:
  push:
    branches: [main]
    paths:
      - 'module.json'
      - 'dependencies-v13.json'
      - 'dependency_manager.py'
      - 'install.sh'
      - 'Install.command'
      - 'export_modules.py'
      - 'Export-Module-Inventory.command'
      - 'README.md'
      - 'scripts/**'
      - 'pinned-manifests/**'
      - '.github/workflows/build-v13-dependencies.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v13-package-validation
  cancel-in-progress: false
jobs:
  audit-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate local metadata and scripts
        run: |
          python3 -m json.tool module.json >/dev/null
          python3 -m json.tool dependencies-v13.json >/dev/null
          for file in pinned-manifests/*.json; do python3 -m json.tool "$file" >/dev/null; done
          python3 -m py_compile dependency_manager.py export_modules.py scripts/validate_v13_dependencies.py
          bash -n install.sh Install.command Export-Module-Inventory.command
          python3 - <<'PY'
          import json
          m=json.load(open("module.json"))
          reg=json.load(open("dependencies-v13.json"))
          automatic={x["id"]:x for x in reg["packages"] if x.get("installMode")=="manifest"}
          assert m["id"]=="v13dependencies"
          assert m["compatibility"]["maximum"]=="13"
          assert m["download"].endswith("/V13dependencies/main/v13dependencies.zip")
          assert len(m["relationships"]["requires"])==len(automatic)
          assert set(automatic)=={d["id"] for d in m["relationships"]["requires"]}
          for d in m["relationships"]["requires"]:
            assert d["manifest"]==automatic[d["id"]]["manifest"],d["id"]
          PY
      - name: Check live HTTPS manifests
        id: manifests
        continue-on-error: true
        run: python3 scripts/validate_v13_dependencies.py --report validation/v13-manifests.json
      - name: Persist manifest HTTP evidence
        if: always()
        run: |
          if [ -f validation/v13-manifests.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add validation/v13-manifests.json
            if ! git diff --cached --quiet; then
              git commit -m "Audit V13 manifest HTTP responses [skip ci]"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
      - name: Require every mandatory manifest to pass
        run: |
          python3 - <<'PY'
          import json
          report=json.load(open("validation/v13-manifests.json"))
          assert report["success"], f"Mandatory manifest failures: {report['failed']}; see validation/v13-manifests.json"
          print(f"Validated {report['passed']} live V13 manifests")
          PY
      - name: Check actual publisher module ZIP archives
        id: archives
        continue-on-error: true
        run: python3 scripts/validate_v13_dependencies.py --archives --report validation/v13-archives.json
      - name: Persist real archive HTTP and ZIP evidence
        if: always()
        run: |
          if [ -f validation/v13-archives.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add validation/v13-archives.json
            if ! git diff --cached --quiet; then
              git commit -m "Audit V13 module release archives [skip ci]"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
      - name: Require every mandatory archive to pass
        run: |
          python3 - <<'PY'
          import json
          report=json.load(open("validation/v13-archives.json"))
          assert report["success"], f"Mandatory archive failures: {report['failed']}; see validation/v13-archives.json"
          print(f"Validated {report['passed']} real V13 module ZIP files")
          PY
      - name: Build installable Foundry V13 module ZIP
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import zipfile
          names = ['module.json','dependencies-v13.json','dependency_manager.py','install.sh','Install.command','export_modules.py','Export-Module-Inventory.command','README.md'] + [str(p) for p in sorted(Path('pinned-manifests').glob('*.json'))]
          with zipfile.ZipFile('v13dependencies.zip','w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
            for name in names:
              p=Path(name)
              info=zipfile.ZipInfo('v13dependencies/'+name)
              info.external_attr=((0o755 if p.suffix in ('.sh','.command') else 0o644)<<16)
              info.compress_type=zipfile.ZIP_DEFLATED
              z.writestr(info,p.read_bytes())
          with zipfile.ZipFile('v13dependencies.zip') as z:
            assert json.loads(z.read('v13dependencies/module.json'))['id']=='v13dependencies'
          PY
      - name: Commit verified module ZIP
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v13dependencies.zip
          if ! git diff --cached --quiet; then
            git commit -m "Build verified V13 dependencies module ZIP [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
